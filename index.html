<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>سوق الغنم | سوق الأغنام والماعز</title>
    <meta name="description" content="أكبر سوق إلكتروني موثوق للأغنام والماعز في المملكة العربية السعودية مع مؤشر الأسعار وحاسبة الولائم ودليل السلالات" />
    <meta name="theme-color" content="#0f4a36" />
    <meta property="og:title" content="سوق الغنم | أكبر سوق إلكتروني للأغنام والماعز في المملكة" />
    <meta property="og:description" content="تصفّح إعلانات موثوقة من مربين وتجار معتمدين، قارن الأسعار، واحسب احتياج وليمتك." />
    <meta property="og:locale" content="ar_SA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700;800&display=swap" />
    <script>
      (function(){
        try {
          var t = localStorage.getItem('souq-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
